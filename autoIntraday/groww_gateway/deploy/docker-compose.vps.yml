services:
  groww-gateway:
    image: python:3.12-slim
    container_name: groww-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      GROWW_API_KEY: ${GROWW_API_KEY}
      GROWW_TOTP_SECRET: ${GROWW_TOTP_SECRET}
      GROWW_GATEWAY_TOKEN: ${GROWW_GATEWAY_TOKEN}
      # Persist the daily access token here so restarts/redeploys REUSE it (valid until 06:00 IST)
      # instead of minting a new one each time — the redeploy churn that tripped Groww's auth limiter.
      GROWW_TOKEN_CACHE_PATH: /var/lib/groww/token.json
    volumes:
      - groww-token:/var/lib/groww     # named volume survives container recreate (up -d / redeploy)
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq git >/dev/null
        rm -rf /tmp/repo
        git clone --depth 1 https://github.com/mohdsuhel2/ai-mini-projects.git /tmp/repo
        cd /tmp/repo/autoIntraday
        pip install -q --no-cache-dir -r requirements.txt -r groww_gateway/requirements-gateway.txt
        export PYTHONPATH=/tmp/repo/autoIntraday
        exec uvicorn groww_gateway.app:app --host 0.0.0.0 --port 8787

volumes:
  groww-token:                         # holds the daily access token across redeploys
