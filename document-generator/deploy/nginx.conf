server {
    listen 80;
    server_name noobius.in www.noobius.in bill-receipt.noobius.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name noobius.in www.noobius.in bill-receipt.noobius.in;

    ssl_certificate /etc/letsencrypt/live/noobius.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noobius.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /fuel-receipt.html;
    }

    location / {
        try_files $uri $uri/ /404.html;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # Groww API gateway (autoIntraday) — proxies to host-network uvicorn on 8787
    location /groww/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# notes.noobius.in — Simply Notes, proxied to the container on 127.0.0.1:8085.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name notes.noobius.in;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name notes.noobius.in;

    ssl_certificate     /etc/letsencrypt/live/noobius.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noobius.in/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Build assets are content-hashed, so they are safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must never be cached, or updates can never ship.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
