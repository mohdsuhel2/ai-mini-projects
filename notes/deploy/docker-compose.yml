# Standalone deployment for Simply Notes.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Set NEXT_PUBLIC_GA_MEASUREMENT_ID in the environment (or a .env beside this
# file) to enable analytics; leave it unset and analytics never loads.

services:
  notes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://notes.noobius.in}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    container_name: simply-notes-web
    restart: unless-stopped
    ports:
      - '8085:3000'
