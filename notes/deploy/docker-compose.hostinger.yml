# Compose project for Hostinger's Docker Manager (VM 1387290).
#
# Deployed by deploy/deploy-hostinger.sh, which POSTs this file's contents to
# the Hostinger API — the same mechanism autoIntraday uses for groww-gateway.
#
# Why this uses `image:` and builds at start rather than `build:`
# ---------------------------------------------------------------
# A `build:` stanza with a git context builds cleanly with Docker locally, but
# Hostinger's Docker Manager reported the compose_up action as a success while
# creating no containers at all. The one project already working on this VPS
# (groww-gateway) also avoids `build:` and clones at runtime, so this follows
# the pattern that is known to work here rather than the one that should.
#
# The build is cached against the repo's commit SHA in a named volume, so a
# restart re-uses the existing build and only a genuine new commit pays for a
# rebuild.
#
# Bound to 127.0.0.1 on purpose: the docforge nginx container (host network,
# owns :80 and :443) is the only thing that should reach it.

services:
  simply-notes:
    image: node:22-alpine
    container_name: simply-notes-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://notes.noobius.in}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - notes-build:/srv
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache git >/dev/null

        REPO=https://github.com/mohdsuhel2/ai-mini-projects.git
        SHA=$$(git ls-remote "$$REPO" main | cut -f1)
        echo "remote main is $$SHA"

        if [ ! -f /srv/.built-sha ] || [ "$$(cat /srv/.built-sha)" != "$$SHA" ]; then
          echo "building $$SHA"
          rm -rf /srv/app
          git clone --depth 1 --branch main "$$REPO" /srv/app
          cd /srv/app/notes
          # --include=dev is required: NODE_ENV=production is set for the
          # server runtime, and npm honours it by skipping devDependencies —
          # which is where Tailwind and TypeScript live, so the build fails
          # without them.
          npm ci --include=dev --no-audit --no-fund
          npm run build
          # server.js does not copy these itself.
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          # Recorded only after everything above succeeded, so a failed build
          # never gets mistaken for a good one on the next restart.
          echo "$$SHA" > /srv/.built-sha
          echo "build complete"
        else
          echo "already built at $$SHA, starting"
        fi

        cd /srv/app/notes/.next/standalone
        exec node server.js

volumes:
  notes-build:
