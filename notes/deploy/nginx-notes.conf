# Reverse proxy for notes.noobius.in -> the Simply Notes container on :8085.
#
# Copy to /etc/nginx/sites-available/notes.noobius.in and symlink into
# sites-enabled, then run certbot for the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name notes.noobius.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.noobius.in;

    ssl_certificate     /etc/letsencrypt/live/notes.noobius.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.noobius.in/privkey.pem;

    # The app holds no accounts and no server-side data, but these cost nothing.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Build assets are content-hashed and safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must never be cached, or updates cannot ship.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
